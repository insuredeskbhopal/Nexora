services:
  postgres:
    image: postgres:16-alpine
    container_name: agentic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: agentic
      POSTGRES_DB: agentic_dev
    ports:
      # Port 5433 isolates our Docker PostgreSQL from any host-installed PostgreSQL on 5432
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentic -d agentic_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agentic-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  s3-storage:
    image: adobe/s3mock:latest
    container_name: agentic-s3
    restart: unless-stopped
    environment:
      initialBuckets: agentic-artifacts
    ports:
      # S3 HTTP endpoint on port 9000
      - '9000:9090'
    volumes:
      - s3_data:/root/.s3mock

  temporal:
    image: temporalio/auto-setup:latest
    container_name: agentic-temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: agentic
      POSTGRES_PWD: agentic
      POSTGRES_SEEDS: postgres
    ports:
      - '7233:7233'

  temporal-ui:
    image: temporalio/ui:latest
    container_name: agentic-temporal-ui
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
    ports:
      - '8233:8080'

volumes:
  postgres_data:
  redis_data:
  s3_data:
